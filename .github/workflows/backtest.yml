name: 2Y Multi-Asset Backtest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/**'
      - '.github/workflows/backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt

      - run: pip install -r research/requirements.txt tabulate

      - name: Download Forex from Dukascopy
        run: |
          git clone --depth 1 https://github.com/saleem-latif/duka-data.git /tmp/duka-data
          pip install -r /tmp/duka-data/requirements.txt
          cd /tmp/duka-data
          python download.py --symbols EURUSD GBPUSD USDJPY --start 2024-09-24 --end 2026-09-23 || true
          python download.py --repair --symbols EURUSD GBPUSD USDJPY --start 2024-09-24 --end 2026-09-23 || true
          mkdir -p "$GITHUB_WORKSPACE/data/forex"
          cp compiled/EURUSD_M5.csv compiled/EURUSD_H1.csv compiled/EURUSD_H4.csv "$GITHUB_WORKSPACE/data/forex/"
          cp compiled/GBPUSD_M5.csv compiled/GBPUSD_H1.csv compiled/GBPUSD_H4.csv "$GITHUB_WORKSPACE/data/forex/"
          cp compiled/USDJPY_M5.csv compiled/USDJPY_H1.csv compiled/USDJPY_H4.csv "$GITHUB_WORKSPACE/data/forex/"

      - name: Download BTCUSDT from Binance public archive
        run: python research/download_btc.py --symbol BTCUSDT --start 2024-09-24 --end 2026-09-23 --outdir data/btc

      - name: Run strategy backtests
        run: python research/run_all.py --data-root data --reports-root reports --btc-cost-bps 5

      - name: Upload backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: h1-breakout-2y-results
          path: reports/
          retention-days: 30
