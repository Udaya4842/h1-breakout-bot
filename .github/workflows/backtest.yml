name: 2Y Multi-Asset Backtest

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'research/**'
      - '.github/workflows/backtest.yml'

jobs:
  forex-chunks:
    name: FX ${{ matrix.symbol }} ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY]
        chunk: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c10, c11, c12]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download chunk from Dukascopy
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.chunk }}" in
            c1)  START=2024-09-24; END=2024-10-31 ;;
            c2)  START=2024-11-01; END=2024-12-31 ;;
            c3)  START=2025-01-01; END=2025-02-28 ;;
            c4)  START=2025-03-01; END=2025-04-30 ;;
            c5)  START=2025-05-01; END=2025-06-30 ;;
            c6)  START=2025-07-01; END=2025-08-31 ;;
            c7)  START=2025-09-01; END=2025-10-31 ;;
            c8)  START=2025-11-01; END=2025-12-31 ;;
            c9)  START=2026-01-01; END=2026-02-28 ;;
            c10) START=2026-03-01; END=2026-04-30 ;;
            c11) START=2026-05-01; END=2026-06-30 ;;
            c12) START=2026-07-01; END=2026-09-23 ;;
            *) echo "Unknown chunk"; exit 2 ;;
          esac

          git clone --depth 1 https://github.com/saleem-latif/duka-data.git /tmp/duka-data
          pip install -r /tmp/duka-data/requirements.txt
          cd /tmp/duka-data

          set +e
          python download.py --symbols "${{ matrix.symbol }}" --start "$START" --end "$END"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "Initial download reported missing hours; running targeted repair."
            python download.py --repair --symbols "${{ matrix.symbol }}" --start "$START" --end "$END"
          fi

          test -s "compiled/${{ matrix.symbol }}_M5.csv"
          mkdir -p "$GITHUB_WORKSPACE/data/fx_chunks"
          cp "compiled/${{ matrix.symbol }}_M5.csv" "$GITHUB_WORKSPACE/data/fx_chunks/${{ matrix.symbol }}_${{ matrix.chunk }}_M5.csv"

      - name: Upload FX chunk
        uses: actions/upload-artifact@v4
        with:
          name: fx-${{ matrix.symbol }}-${{ matrix.chunk }}
          path: data/fx_chunks/*.csv
          if-no-files-found: error
          retention-days: 3

  btc-data:
    name: Download BTCUSDT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt

      - run: pip install -r research/requirements.txt

      - name: Download BTCUSDT from Binance public archive
        run: python research/download_btc.py --symbol BTCUSDT --start 2024-09-24 --end 2026-09-23 --outdir data/btc

      - name: Upload BTC data
        uses: actions/upload-artifact@v4
        with:
          name: btc-data
          path: data/btc/
          if-no-files-found: error
          retention-days: 3

  backtest:
    name: Run backtests
    needs: [forex-chunks, btc-data]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt

      - run: pip install -r research/requirements.txt tabulate

      - name: Download FX chunks
        uses: actions/download-artifact@v4
        with:
          pattern: fx-*
          path: data/fx_chunks
          merge-multiple: true

      - name: Merge FX chunks
        run: |
          python research/merge_fx_chunks.py --symbol EURUSD --chunks-dir data/fx_chunks --outdir data/forex
          python research/merge_fx_chunks.py --symbol GBPUSD --chunks-dir data/fx_chunks --outdir data/forex
          python research/merge_fx_chunks.py --symbol USDJPY --chunks-dir data/fx_chunks --outdir data/forex

      - name: Download BTC artifact
        uses: actions/download-artifact@v4
        with:
          name: btc-data
          path: data/btc

      - name: Run strategy backtests
        run: python research/run_all.py --data-root data --reports-root reports --btc-cost-bps 5

      - name: Upload backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: h1-breakout-2y-results
          path: reports/
          if-no-files-found: error
          retention-days: 30
