name: Build cTrader cBot
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Restore
        run: dotnet restore src/MultiAssetH1BreakoutBot.csproj
      - name: Build .algo
        run: dotnet build src/MultiAssetH1BreakoutBot.csproj --configuration Release --no-restore -p:AlgoPublish=false
      - name: Locate .algo
        run: |
          find src -type f -name '*.algo' -print
          test -n "$(find src -type f -name '*.algo' -print -quit)"
      - name: Upload SignalOnly build
        uses: actions/upload-artifact@v4
        with:
          name: MultiAssetH1BreakoutBot-algo
          path: src/**/*.algo
          if-no-files-found: error
